<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" fill="none">
  <!-- Palestine Watermelon & Heritage Solidarity Tile 720x720 -->
  <!-- Generous 180px spacing for an airy, elegant, luxurious feel -->

  <!-- Row 1 (~70px) -->
  <!-- 1. Watermelon Slice (90, 70) -->
  <g transform="translate(65, 45) rotate(-10 25 25)">
    <path d="M4 14 C18 48 52 48 66 14 Z" fill="#15803d" stroke="#166534" stroke-width="1.6" />
    <path d="M8 16 C20 44 50 44 62 16 Z" fill="#dcfce7" />
    <path d="M12 18 C22 40 48 40 58 18 Z" fill="#e11d48" />
    <ellipse cx="24" cy="25" rx="1.5" ry="2.5" fill="#0f172a" transform="rotate(-15 24 25)" />
    <ellipse cx="35" cy="30" rx="1.5" ry="2.5" fill="#0f172a" />
    <ellipse cx="46" cy="25" rx="1.5" ry="2.5" fill="#0f172a" transform="rotate(15 46 25)" />
  </g>

  <!-- 2. Olive Branch with Olives (270, 85) -->
  <g transform="translate(245, 60)" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 40 Q24 24 44 8" />
    <path d="M15 30 Q10 20 18 18 Q23 22 15 30 Z" fill="#86efac" fill-opacity="0.35" />
    <path d="M26 22 Q21 12 29 10 Q34 14 26 22 Z" fill="#86efac" fill-opacity="0.35" />
    <path d="M30 28 Q40 24 38 16 Q30 18 30 28 Z" fill="#86efac" fill-opacity="0.35" />
    <circle cx="12" cy="18" r="3" fill="#15803d" stroke="none" />
    <circle cx="36" cy="30" r="3" fill="#15803d" stroke="none" />
  </g>

  <!-- 3. Key of Return (مفتاح العودة) (450, 65) -->
  <g transform="translate(425, 42) rotate(35 25 25)" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="14" r="10" fill="#fef08a" fill-opacity="0.25" />
    <circle cx="14" cy="14" r="4" fill="none" />
    <line x1="24" y1="14" x2="48" y2="14" />
    <line x1="38" y1="14" x2="38" y2="21" />
    <line x1="44" y1="14" x2="44" y2="21" />
    <line x1="44" y1="21" x2="40" y2="21" />
  </g>

  <!-- 4. Palestinian Tatreez Diamond (تطريز فلسطيني) (630, 80) -->
  <g transform="translate(608, 58)" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 6 L42 24 L24 42 L6 24 Z" fill="#fee2e2" fill-opacity="0.2" />
    <path d="M24 14 L34 24 L24 34 L14 24 Z" fill="#dc2626" fill-opacity="0.2" />
    <line x1="24" y1="6" x2="24" y2="42" />
    <line x1="6" y1="24" x2="42" y2="24" />
    <circle cx="24" cy="24" r="2" fill="#dc2626" />
  </g>

  <!-- Row 2 (~250px) -->
  <!-- 5. Dove of Peace with Olive Sprig (80, 260) -->
  <g transform="translate(58, 238)" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 26 C12 20 18 16 28 16 C34 16 40 20 44 26 C40 32 32 34 22 34 C16 34 10 32 8 26 Z" />
    <path d="M22 16 C20 8 26 4 32 8 C36 12 36 18 34 22" />
    <circle cx="14" cy="22" r="1.5" fill="#94a3b8" />
    <!-- Olive sprig in beak -->
    <path d="M4 25 L8 24" stroke="#16a34a" />
    <circle cx="3" cy="25" r="1.5" fill="#16a34a" stroke="none" />
  </g>

  <!-- 6. Traditional Keffiyeh Mesh Diamond Pattern (260, 240) -->
  <g transform="translate(238, 218)" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 24 L24 12 L36 24 L24 36 Z" />
    <path d="M24 12 L24 36 M12 24 L36 24" stroke-dasharray="2 3" />
    <circle cx="24" cy="24" r="3" fill="#64748b" />
  </g>

  <!-- 7. Upright Watermelon Wedge (440, 265) -->
  <g transform="translate(418, 242) rotate(45 25 25)">
    <path d="M6 14 C18 42 46 42 58 14 Z" fill="#15803d" stroke="#166534" stroke-width="1.6" />
    <path d="M9 16 C19 38 45 38 55 16 Z" fill="#bbf7d0" />
    <path d="M12 18 C21 35 43 35 52 18 Z" fill="#f43f5e" />
    <circle cx="24" cy="24" r="1.5" fill="#020617" />
    <circle cx="38" cy="24" r="1.5" fill="#020617" />
  </g>

  <!-- 8. Palestinian Olive Tree (620, 245) -->
  <g transform="translate(598, 222)" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 8 C10 8 7 15 10 20 C7 24 9 30 14 32 C10 35 12 40 18 40 C24 40 26 35 22 32 C27 30 28 24 25 20 C28 15 25 8 18 8 Z" fill="#bbf7d0" fill-opacity="0.2" />
    <line x1="18" y1="40" x2="18" y2="48" stroke="#78350f" stroke-width="2.5" />
    <circle cx="14" cy="18" r="2" fill="#15803d" stroke="none" />
    <circle cx="22" cy="26" r="2" fill="#15803d" stroke="none" />
  </g>

  <!-- Row 3 (~430px) -->
  <!-- 9. Palestinian Tatreez Cypress Tree (سروة مطرزة) (100, 435) -->
  <g transform="translate(80, 412)" stroke="#15803d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 6 L12 20 H32 Z" fill="#dcfce7" fill-opacity="0.3" />
    <path d="M22 16 L8 32 H36 Z" fill="#dcfce7" fill-opacity="0.3" />
    <line x1="22" y1="32" x2="22" y2="44" stroke="#78350f" stroke-width="2.5" />
    <circle cx="22" cy="6" r="2" fill="#dc2626" stroke="none" />
  </g>

  <!-- 10. Watermelon Bite Wedge (280, 450) -->
  <g transform="translate(258, 428) rotate(-15 25 25)">
    <path d="M6 14 C18 42 46 42 58 14 Z" fill="#15803d" stroke="#166534" stroke-width="1.6" />
    <path d="M9 16 C19 38 45 38 55 16 Z" fill="#bbf7d0" />
    <path d="M12 18 C21 35 43 35 52 18 Z" fill="#f43f5e" />
    <circle cx="30" cy="26" r="1.5" fill="#020617" />
  </g>

  <!-- 11. Solidarity Heart with Olive Wreath (460, 425) -->
  <g transform="translate(438, 405)" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 36 C10 26 4 18 4 12 C4 6 9 3 14 3 C18 3 20 6 22 8 C24 6 26 3 30 3 C35 3 40 6 40 12 C40 18 34 26 22 36 Z" fill="#fee2e2" fill-opacity="0.25" />
    <!-- Olive sprig overlay -->
    <path d="M30 30 Q36 24 38 16" stroke="#16a34a" />
    <circle cx="34" cy="22" r="1.5" fill="#16a34a" stroke="none" />
  </g>

  <!-- 12. Traditional Hospitality Dallah / Tea Kettle (640, 440) -->
  <g transform="translate(618, 418)" stroke="#ca8a04" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 16 L18 6 L22 16" />
    <path d="M12 16 H24 L28 36 H8 Z" fill="#fef08a" fill-opacity="0.2" />
    <path d="M28 20 C34 22 34 30 28 32" />
    <path d="M10 24 C4 20 6 12 12 10" />
    <line x1="6" y1="36" x2="30" y2="36" stroke-width="2" />
  </g>

  <!-- Row 4 (~610px) -->
  <!-- 13. Sunburst over Olive Hills (90, 620) -->
  <g transform="translate(68, 598)" stroke="#ca8a04" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="22" cy="22" r="8" fill="#fef08a" fill-opacity="0.3" />
    <path d="M22 6 V10 M22 34 V38 M6 22 H10 M34 22 H38 M11 11 L14 14 M30 30 L33 33 M11 33 L14 30 M30 14 L33 11" />
  </g>

  <!-- 14. Key of Return Variant (270, 600) -->
  <g transform="translate(248, 578) rotate(-40 25 25)" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="14" r="10" fill="#fef08a" fill-opacity="0.25" />
    <circle cx="14" cy="14" r="4" fill="none" />
    <line x1="24" y1="14" x2="48" y2="14" />
    <line x1="38" y1="14" x2="38" y2="21" />
    <line x1="44" y1="14" x2="44" y2="21" />
  </g>

  <!-- 15. Tatreez Star of Bethlehem Motif (450, 625) -->
  <g transform="translate(428, 605)" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="22,6 27,17 38,22 27,27 22,38 17,27 6,22 17,17" fill="#fee2e2" fill-opacity="0.25" />
    <circle cx="22" cy="22" r="3" fill="#dc2626" />
  </g>

  <!-- 16. Watermelon Slice Smile (630, 605) -->
  <g transform="translate(608, 585) rotate(15 25 25)">
    <path d="M4 14 C18 48 52 48 66 14 Z" fill="#15803d" stroke="#166534" stroke-width="1.6" />
    <path d="M8 16 C20 44 50 44 62 16 Z" fill="#dcfce7" />
    <path d="M12 18 C22 40 48 40 58 18 Z" fill="#e11d48" />
    <ellipse cx="28" cy="28" rx="1.5" ry="2.5" fill="#0f172a" />
    <ellipse cx="42" cy="28" rx="1.5" ry="2.5" fill="#0f172a" />
  </g>
</svg>